[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sistema-sia"
version = "2.21.0"
description = "Sistema de relatórios SIA/SUS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "chardet==5.2.0",
    "customtkinter==6.0.0",
    "dbfread==2.0.7",
    "matplotlib==3.11.0",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "pillow==12.0.0",
    "pyarrow==22.0.0",
    "reportlab==4.4.4",
]

[project.gui-scripts]
sistema-sia = "sia_app.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sia_app = ["ui/*.json"]
